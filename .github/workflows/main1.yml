name: Playwright Automation Google

on:
  workflow_dispatch:

jobs:
  run-playwright:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          sudo apt install -y tor  # Install tor if required
          
          # Install necessary Python packages
          pip install typing_extensions psutil pandas nest_asyncio pysocks duckduckgo-search primp
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client
          pip install --upgrade google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client

      
      - name: Decode and save JSON file
        run: echo "${{ secrets.gar }}" | base64 --decode > file.json

      - name: Run Playwright script
        run: python goole.py
